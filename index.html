<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bath Time Buddy</title>
<style>
  :root {
    --fur: #e3a063;
    --fur-dark: #c97d42;
    --snout: #fbefdd;
    --nose: #3b2a20;
    --eye: #2b2118;
    --highlight: #ffffff;
    --tongue: #f3a6b7;

    --wall-top: #cdeee0;
    --wall-bottom: #fff3da;
    --tub-fill: #cdeeff;
    --tub-edge: #a9d9f2;
    --card: #fffdf8;
    --ink: #3a352f;
    --ink-soft: #7a7268;
    --mint: #6bc2a9;
    --mint-dark: #4fa88e;
    --coral: #ff9466;
    --coral-dark: #f07a48;
    --track: #ece5d6;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Segoe UI Rounded",
      "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--wall-top) 0%, var(--wall-top) 38%, var(--wall-bottom) 100%);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
  }

  .app {
    width: 100%;
    max-width: 460px;
  }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    padding: 0 4px;
  }

  .masthead h1 {
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .masthead p {
    margin: 2px 0 0;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

  .reset-link {
    border: none;
    background: none;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .reset-link:hover { color: var(--ink); background: rgba(0,0,0,0.05); }
  .reset-link:focus-visible { outline: 3px solid var(--mint-dark); outline-offset: 2px; }

  .card {
    background: var(--card);
    border-radius: 28px;
    padding: 18px;
    box-shadow: 0 18px 40px -22px rgba(60, 45, 20, 0.45);
  }

  .stage {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: radial-gradient(120% 90% at 50% 15%, var(--tub-fill) 0%, var(--tub-edge) 100%);
    aspect-ratio: 4 / 3.5;
  }

  .bubble-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .bubble {
    position: absolute;
    bottom: -10%;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95), rgba(255,255,255,0.15) 60%, rgba(255,255,255,0.05) 100%);
    animation: float-up linear infinite;
    opacity: 0;
  }

  @keyframes float-up {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    8% { opacity: 0.9; }
    90% { opacity: 0.7; }
    100% { transform: translateY(-320px) translateX(var(--drift, 10px)); opacity: 0; }
  }

  svg.scene {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
  }

  #puppyGroup {
    animation: idle-bob 3.2s ease-in-out infinite;
    transform-origin: 200px 260px;
  }

  @keyframes idle-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .tail {
    transform-box: fill-box;
    transform-origin: 0% 60%;
    animation: wag 1.5s ease-in-out infinite;
  }
  .app.happy .tail {
    animation: wag-fast 0.45s ease-in-out infinite;
  }
  @keyframes wag {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(14deg); }
  }
  @keyframes wag-fast {
    0%, 100% { transform: rotate(-20deg); }
    50% { transform: rotate(26deg); }
  }

  .fur-main { fill: var(--fur); }
  .fur-dark { fill: var(--fur-dark); }
  .snout { fill: var(--snout); }
  .nose { fill: var(--nose); }
  .eye { fill: var(--eye); }
  .eye-highlight { fill: var(--highlight); }
  .tongue { fill: var(--tongue); }
  .mouth { fill: none; stroke: var(--nose); stroke-width: 3; stroke-linecap: round; }

  .fluff #puppyGroup {
    animation: idle-bob 3.2s ease-in-out infinite, fluff-pulse 0.5s ease-out 1;
  }
  @keyframes fluff-pulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.06, 0.94); }
    100% { transform: scale(1); }
  }

  .dirt-spot {
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .dirt-spot:hover { opacity: 0.85; }
  .dirt-spot.popping {
    animation: pop-away 0.22s ease-in forwards;
  }
  @keyframes pop-away {
    to { transform: scale(0.2); opacity: 0; }
  }

  .suds {
    fill: rgba(255,255,255,0.75);
  }
  .suds-line {
    fill: none;
    stroke: rgba(255,255,255,0.9);
    stroke-width: 6;
    stroke-linecap: round;
  }

  .name-tag {
    position: absolute;
    top: 10px;
    left: 12px;
    background: rgba(255,255,255,0.85);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ink);
    box-shadow: 0 4px 10px -4px rgba(0,0,0,0.25);
  }

  .status {
    margin: 14px 4px 6px;
    min-height: 22px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink);
    text-align: center;
  }

  .meter {
    margin: 6px 4px 0;
  }
  .meter-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-bottom: 4px;
    font-weight: 600;
  }
  .meter-track {
    height: 12px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.35s ease;
    width: 0%;
  }
  .meter-fill.clean { background: linear-gradient(90deg, var(--mint-dark), var(--mint)); }
  .meter-fill.dry { background: linear-gradient(90deg, var(--coral-dark), var(--coral)); }

  .panel {
    margin-top: 16px;
    display: none;
  }
  .panel.visible { display: block; }

  .action-btn {
    width: 100%;
    border: none;
    border-radius: 16px;
    padding: 14px 18px;
    font-size: 1.02rem;
    font-weight: 700;
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 20px -10px rgba(0,0,0,0.4);
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  .action-btn:hover { filter: brightness(1.05); }
  .action-btn:active { transform: translateY(1px) scale(0.99); }
  .action-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .action-btn.dry { background: linear-gradient(180deg, var(--coral), var(--coral-dark)); }
  .action-btn.again { background: linear-gradient(180deg, var(--mint), var(--mint-dark)); }

  .celebrate {
    text-align: center;
    padding-top: 4px;
  }
  .celebrate h2 {
    margin: 0 0 4px;
    font-size: 1.2rem;
  }
  .celebrate p {
    margin: 0 0 14px;
    color: var(--ink-soft);
    font-size: 0.92rem;
  }

  .confetti-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    top: -8%;
    font-size: 18px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(340px) rotate(200deg); opacity: 0.15; }
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }

  .fx-field {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
  }
  .spark {
    position: absolute;
    font-size: 14px;
    animation: spark-burst 0.55s ease-out forwards;
  }
  @keyframes spark-burst {
    0% { transform: translate(0,0) scale(0.6); opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scale(1.1); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    #puppyGroup, .tail, .bubble, .confetti-piece, .spark {
      animation: none !important;
    }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="masthead">
    <div>
      <h1>Bath Time Buddy</h1>
      <p>Scrub away the mud, then blow-dry for maximum floof.</p>
    </div>
    <button class="reset-link" id="newPuppyBtn" type="button">🔄 New puppy</button>
  </div>

  <div class="card">
    <div class="stage">
      <div class="bubble-field" id="bubbleField"></div>
      <div class="name-tag" id="nameTag">Meet Puddle!</div>

      <svg class="scene" viewBox="0 0 400 380" role="img" aria-label="A puppy in a bath, covered in a few muddy spots">
        <g id="puppyGroup">

          <!-- tail -->
          <g class="tail">
            <path class="fur-dark" d="M 300 230 C 350 210, 365 240, 340 260 C 360 255, 355 285, 320 275 C 335 260, 315 245, 300 245 Z"/>
          </g>

          <!-- back paws -->
          <ellipse class="fur-dark" cx="150" cy="330" rx="26" ry="16"/>
          <ellipse class="fur-dark" cx="250" cy="330" rx="26" ry="16"/>

          <!-- body -->
          <ellipse class="fur-main" cx="200" cy="270" rx="105" ry="80"/>

          <!-- front paws -->
          <ellipse class="fur-dark" cx="160" cy="335" rx="24" ry="15"/>
          <ellipse class="fur-dark" cx="240" cy="335" rx="24" ry="15"/>

          <!-- belly patch -->
          <ellipse class="snout" cx="200" cy="290" rx="55" ry="40"/>

          <!-- ears -->
          <path class="fur-dark" d="M 118 100 C 70 95, 55 150, 95 185 C 115 165, 128 130, 118 100 Z"/>
          <path class="fur-dark" d="M 282 100 C 330 95, 345 150, 305 185 C 285 165, 272 130, 282 100 Z"/>

          <!-- head -->
          <circle class="fur-main" cx="200" cy="150" r="88"/>

          <!-- snout -->
          <ellipse class="snout" cx="200" cy="182" rx="42" ry="30"/>

          <!-- nose -->
          <ellipse class="nose" cx="200" cy="164" rx="15" ry="10"/>

          <!-- mouth -->
          <path class="mouth" d="M 200 176 L 200 190 M 200 190 Q 182 202 168 192 M 200 190 Q 218 202 232 192"/>
          <path class="tongue" d="M 196 192 Q 200 214 206 192 Q 201 200 196 192 Z"/>

          <!-- eyes -->
          <circle class="eye" cx="168" cy="130" r="10"/>
          <circle class="eye" cx="232" cy="130" r="10"/>
          <circle class="eye-highlight" cx="171" cy="126" r="3"/>
          <circle class="eye-highlight" cx="235" cy="126" r="3"/>

          <!-- cheeks patches -->
          <circle class="fur-dark" cx="140" cy="150" r="10" opacity="0.5"/>
          <circle class="fur-dark" cx="260" cy="150" r="10" opacity="0.5"/>

          <!-- dirt spots injected here -->
          <g id="dirtLayer"></g>

        </g>

        <!-- shallow suds line in front of paws -->
        <path class="suds" d="M 20 355 Q 100 330 200 350 Q 300 330 380 355 L 380 380 L 20 380 Z"/>
        <path class="suds-line" d="M 30 350 Q 110 328 200 346 Q 290 328 370 350"/>
      </svg>

      <div class="confetti-field" id="confettiField"></div>
    </div>

    <div class="status" id="statusText" aria-live="polite">7 muddy spots left. Tap each one to scrub it clean!</div>

    <div class="meter" id="cleanMeterWrap">
      <div class="meter-label"><span>Cleanliness</span><span id="cleanPct">0%</span></div>
      <div class="meter-track"><div class="meter-fill clean" id="cleanFill"></div></div>
    </div>

    <div class="meter panel" id="dryMeterWrap">
      <div class="meter-label"><span>Dryness</span><span id="dryPct">0%</span></div>
      <div class="meter-track"><div class="meter-fill dry" id="dryFill"></div></div>
    </div>

    <div class="panel" id="dryPanel">
      <button class="action-btn dry" id="dryBtn" type="button">💨 Blow-dry Puddle</button>
    </div>

    <div class="panel" id="cleanPanel">
      <div class="celebrate">
        <h2 id="celebrateName">Puddle is squeaky clean!</h2>
        <p>Full of floof and ready for zoomies.</p>
      </div>
      <button class="action-btn again" id="againBtn" type="button">🛁 Bath again</button>
    </div>
  </div>
</div>

<div class="fx-field" id="fxField"></div>

<script>
(function () {
  var NAMES = ["Puddle", "Biscuit", "Nugget", "Waffles", "Marbles", "Peanut", "Clover", "Scout"];
  var PALETTES = [
    { fur: "#e3a063", furDark: "#c97d42", snout: "#fbefdd" },
    { fur: "#8a5a3c", furDark: "#5f3b26", snout: "#f2e2c8" },
    { fur: "#f4efe6", furDark: "#cfc4b0", snout: "#ffffff" },
    { fur: "#3a3a3a", furDark: "#1f1f1f", snout: "#f5efe4" },
    { fur: "#f0c68a", furDark: "#e0a25c", snout: "#fff6e6" }
  ];

  var SLOTS = [
    { x: 150, y: 235 }, { x: 250, y: 235 }, { x: 200, y: 295 },
    { x: 128, y: 275 }, { x: 272, y: 275 }, { x: 145, y: 118 },
    { x: 255, y: 118 }, { x: 195, y: 340 }, { x: 112, y: 205 },
    { x: 288, y: 205 }
  ];

  var root = document.documentElement;
  var app = document.getElementById("app");
  var dirtLayer = document.getElementById("dirtLayer");
  var statusText = document.getElementById("statusText");
  var cleanFill = document.getElementById("cleanFill");
  var cleanPct = document.getElementById("cleanPct");
  var dryFill = document.getElementById("dryFill");
  var dryPct = document.getElementById("dryPct");
  var dryMeterWrap = document.getElementById("dryMeterWrap");
  var dryPanel = document.getElementById("dryPanel");
  var cleanPanel = document.getElementById("cleanPanel");
  var dryBtn = document.getElementById("dryBtn");
  var againBtn = document.getElementById("againBtn");
  var newPuppyBtn = document.getElementById("newPuppyBtn");
  var nameTag = document.getElementById("nameTag");
  var celebrateName = document.getElementById("celebrateName");
  var confettiField = document.getElementById("confettiField");
  var fxField = document.getElementById("fxField");
  var bubbleField = document.getElementById("bubbleField");
  var stage = document.querySelector(".stage");

  var totalDirt = 7;
  var remaining = totalDirt;
  var dryness = 0;
  var puppyName = "Puddle";

  function rand(min, max) { return Math.random() * (max - min) + min; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function applyPalette() {
    var p = pick(PALETTES);
    root.style.setProperty("--fur", p.fur);
    root.style.setProperty("--fur-dark", p.furDark);
    root.style.setProperty("--snout", p.snout);
  }

  function pickName() {
    puppyName = pick(NAMES);
    nameTag.textContent = "Meet " + puppyName + "!";
    celebrateName.textContent = puppyName + " is squeaky clean!";
  }

  function spawnBubbles() {
    bubbleField.innerHTML = "";
    var count = 9;
    for (var i = 0; i < count; i++) {
      var b = document.createElement("div");
      b.className = "bubble";
      var size = rand(10, 26);
      b.style.width = size + "px";
      b.style.height = size + "px";
      b.style.left = rand(4, 92) + "%";
      b.style.setProperty("--drift", rand(-24, 24) + "px");
      b.style.animationDuration = rand(5, 9) + "s";
      b.style.animationDelay = rand(0, 8) + "s";
      bubbleField.appendChild(b);
    }
  }

  function buildDirt() {
    dirtLayer.innerHTML = "";
    var slots = shuffle(SLOTS).slice(0, totalDirt);
    slots.forEach(function (slot, i) {
      var el = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
      var jx = slot.x + rand(-6, 6);
      var jy = slot.y + rand(-6, 6);
      var rx = rand(14, 21);
      var ry = rand(10, 15);
      el.setAttribute("cx", jx);
      el.setAttribute("cy", jy);
      el.setAttribute("rx", rx);
      el.setAttribute("ry", ry);
      el.setAttribute("transform", "rotate(" + rand(-25, 25) + " " + jx + " " + jy + ")");
      el.setAttribute("fill", i % 2 === 0 ? "#8b5e3c" : "#7a4f30");
      el.setAttribute("class", "dirt-spot");
      el.setAttribute("role", "button");
      el.setAttribute("tabindex", "0");
      el.setAttribute("aria-label", "Scrub a muddy spot");
      el.addEventListener("click", function (evt) { handleScrub(el, evt); });
      el.addEventListener("keydown", function (evt) {
        if (evt.key === "Enter" || evt.key === " ") {
          evt.preventDefault();
          handleScrub(el, evt);
        }
      });
      dirtLayer.appendChild(el);
    });
  }

  function clientPointFromEvent(evt) {
    if (evt.clientX !== undefined && (evt.clientX !== 0 || evt.clientY !== 0)) {
      return { x: evt.clientX, y: evt.clientY };
    }
    var rect = stage.getBoundingClientRect();
    return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  }

  function spawnSparkles(point) {
    var glyphs = ["✨", "💧", "⭐"];
    for (var i = 0; i < 5; i++) {
      var s = document.createElement("span");
      s.className = "spark";
      s.textContent = pick(glyphs);
      s.style.left = point.x + "px";
      s.style.top = point.y + "px";
      var angle = rand(0, Math.PI * 2);
      var dist = rand(20, 50);
      s.style.setProperty("--sx", Math.cos(angle) * dist + "px");
      s.style.setProperty("--sy", Math.sin(angle) * dist + "px");
      fxField.appendChild(s);
      (function (node) { setTimeout(function () { node.remove(); }, 600); })(s);
    }
  }

  function handleScrub(el, evt) {
    if (el.classList.contains("popping")) return;
    spawnSparkles(clientPointFromEvent(evt));
    el.classList.add("popping");
    setTimeout(function () { el.remove(); }, 220);

    remaining -= 1;
    var pct = Math.round(((totalDirt - remaining) / totalDirt) * 100);
    cleanFill.style.width = pct + "%";
    cleanPct.textContent = pct + "%";

    if (remaining > 0) {
      statusText.textContent = remaining + " muddy spot" + (remaining === 1 ? "" : "s") + " left. Keep scrubbing!";
    } else {
      statusText.textContent = puppyName + " is all scrubbed! Time to blow-dry.";
      setTimeout(startDryPhase, 500);
    }
  }

  function startDryPhase() {
    dryMeterWrap.classList.add("visible");
    dryPanel.classList.add("visible");
  }

  function spawnWhoosh(point) {
    var glyphs = ["💨", "〰️"];
    for (var i = 0; i < 3; i++) {
      var s = document.createElement("span");
      s.className = "spark";
      s.textContent = pick(glyphs);
      s.style.left = point.x + "px";
      s.style.top = point.y + "px";
      var angle = rand(-Math.PI * 0.8, -Math.PI * 0.2);
      var dist = rand(30, 60);
      s.style.setProperty("--sx", Math.cos(angle) * dist + "px");
      s.style.setProperty("--sy", Math.sin(angle) * dist + "px");
      fxField.appendChild(s);
      (function (node) { setTimeout(function () { node.remove(); }, 600); })(s);
    }
  }

  dryBtn.addEventListener("click", function (evt) {
    dryness = Math.min(100, dryness + rand(14, 22));
    var pct = Math.round(dryness);
    dryFill.style.width = pct + "%";
    dryPct.textContent = pct + "%";
    spawnWhoosh(clientPointFromEvent(evt));

    app.classList.add("fluff");
    setTimeout(function () { app.classList.remove("fluff"); }, 500);

    if (dryness < 40) {
      statusText.textContent = "Getting fluffy...";
    } else if (dryness < 90) {
      statusText.textContent = "Looking floofy!";
    } else {
      statusText.textContent = puppyName + " is dry and happy!";
    }

    if (dryness >= 100) {
      setTimeout(finishBath, 400);
    }
  });

  function finishBath() {
    dryPanel.classList.remove("visible");
    cleanPanel.classList.add("visible");
    app.classList.add("happy");
    launchConfetti();
  }

  function launchConfetti() {
    var glyphs = ["❤️", "🐾", "✨", "⭐"];
    confettiField.innerHTML = "";
    var count = 24;
    for (var i = 0; i < count; i++) {
      var c = document.createElement("span");
      c.className = "confetti-piece";
      c.textContent = pick(glyphs);
      c.style.left = rand(4, 94) + "%";
      c.style.animationDuration = rand(1.6, 2.6) + "s";
      c.style.animationDelay = rand(0, 0.6) + "s";
      confettiField.appendChild(c);
    }
    setTimeout(function () { confettiField.innerHTML = ""; }, 3400);
  }

  function initGame() {
    app.classList.remove("happy", "fluff");
    remaining = totalDirt;
    dryness = 0;
    applyPalette();
    pickName();
    spawnBubbles();
    buildDirt();

    cleanFill.style.width = "0%";
    cleanPct.textContent = "0%";
    dryFill.style.width = "0%";
    dryPct.textContent = "0%";
    dryMeterWrap.classList.remove("visible");
    dryPanel.classList.remove("visible");
    cleanPanel.classList.remove("visible");
    confettiField.innerHTML = "";

    statusText.textContent = totalDirt + " muddy spots left. Tap each one to scrub it clean!";
  }

  againBtn.addEventListener("click", initGame);
  newPuppyBtn.addEventListener("click", initGame);

  initGame();
})();
</script>
</body>
</html>
